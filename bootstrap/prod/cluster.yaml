apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cluster
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: ssh://git@github.com/ocf/flux
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/prod/ks
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  decryption:
    provider: sops
  patches:
    - target: # patch all kustomizations
        kind: Kustomization 
      patch: |
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: ignored
        spec:
          decryption:
            provider: sops
          patches:
            - target:
                kind: Ingress
              patch: |
                apiVersion: networking.k8s.io/v1
                kind: Ingress
                metadata:
                  name: ignored
                  annotations:
                    cert-manager.io/cluster-issuer: letsencrypt
                    ingress.kubernetes.io/force-ssl-redirect: 'true'
                    io.cilium/websocket: enabled
                    kubernetes.io/tls-acme: 'true'
                    projectcontour.io/websocket-routes: /
