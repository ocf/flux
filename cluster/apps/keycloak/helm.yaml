apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: keycloak
  namespace: keycloak
spec:
  type: oci
  interval: 15m0s
  url: oci://quay.io/keycloak
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: keycloak-config-cli
  namespace: keycloak
spec:
  interval: 15m0s
  ref:
    tag: v6.5.1
  url: https://github.com/adorsys/keycloak-config-cli.git
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: keycloak
spec:
  interval: 15m0s
  timeout: 5m0s
  chart:
    spec:
      chart: keycloak-operator-helm
      version: 26.8.2 # {"$imagepolicy": "flux-system:keycloak:tag"}
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: keycloak
  releaseName: keycloak
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak-config-cli
  namespace: keycloak
spec:
  interval: 15m0s
  timeout: 5m0s
  chart:
    spec:
      chart: ./contrib/charts/keycloak-config-cli
      version: 6.5.1
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: GitRepository
        name: keycloak-config-cli
  releaseName: keycloak-config-cli
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  valuesFrom: # keycloak configuration
    - kind: ConfigMap
      name: keycloak-config-cli-values
  values:
    image:
      tag: "6.5.1-21.1.2"
    env:
      KEYCLOAK_URL: http://keycloak-service:8080
      KEYCLOAK_USER: ocf-admin
      IMPORT_PATH: /config/
    existingSecret: keycloak-admin-secret
