apiVersion: apps/v1
kind: Deployment
metadata:
  name: labmap
  namespace: labmap
spec:
  replicas: 1
  selector:
    matchLabels:
      ocf.berkeley.edu/flux: labmap
  template:
    metadata:
      labels:
        ocf.berkeley.edu/flux: labmap
    spec:
      containers:
      - env: []
        envFrom:
        - secretRef:
            name: prometheus-secret
        image: ghcr.io/ocf/labmap2:latest@sha256:366ca63403d93de78f8306b075ffc2498351159a08d9b8df2f18b0109a4d8faf # {"$imagepolicy": "flux-system:labmap-backend"}
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          timeoutSeconds: 3
        name: main
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      dnsConfig:
        searches:
        - ocf.berkeley.edu
      dnsPolicy: ClusterFirst
