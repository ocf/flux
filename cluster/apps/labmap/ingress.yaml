apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: labmap
  namespace: labmap
spec:
  rules:
  - host: labmap.ocf.berkeley.edu
    http:
      paths:
      - backend:
          service:
            name: labmap
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - labmap.ocf.berkeley.edu
    secretName: labmap-tls
