apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: mkdocs
  namespace: flux-system
spec:
  image: ghcr.io/ocf/ocf-docs
  interval: 5m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: mkdocs
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: mkdocs
  filterTags:
    pattern: '^latest$'
  policy:
    alphabetical: {}
  digestReflectionPolicy: Always
  interval: 10m
