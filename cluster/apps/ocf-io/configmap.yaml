apiVersion: v1
kind: ConfigMap
metadata:
  name: ocf-io-nginx
  namespace: ocf-io
data:
  nginx.conf: |
    user nginx;
    worker_processes  auto;
    pid /var/run/nginx.pid;

    events {
        worker_connections  1024;
    }

    http {
        server {
            listen 80;
            server_name ~^(.+).ocf.io$;

            return 302 $scheme://$1.ocf.berkeley.edu$request_uri;
        }
    }
