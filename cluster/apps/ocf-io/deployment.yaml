apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocf-io
  namespace: ocf-io
spec:
  replicas: 1
  selector:
    matchLabels:
      ocf.berkeley.edu/flux: ocf-io
  template:
    metadata:
      labels:
        ocf.berkeley.edu/flux: ocf-io
    spec:
      containers:
      - image: nginx:1.23.4 # {"$imagepolicy": "flux-system:nginx"}
        imagePullPolicy: IfNotPresent
        name: main
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: /etc/nginx/nginx.conf
          name: nginx-conf
          subPath: nginx.conf
      volumes:
      - configMap:
          name: ocf-io-nginx
        name: nginx-conf
