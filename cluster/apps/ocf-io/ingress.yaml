apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ocf-io
  namespace: ocf-io
spec:
  rules:
  - host: '*.ocf.io'
    http:
      paths:
      - backend:
          service:
            name: ocf-io
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - '*.ocf.io'
    secretName: ocf-io-tls