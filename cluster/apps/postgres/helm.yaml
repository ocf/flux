apiVersion: v1
kind: Namespace
metadata:
  name: postgres
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: postgres
  namespace: postgres
spec:
  interval: 15m0s
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
  namespace: postgres
spec:
  interval: 15m0s
  timeout: 5m0s
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.1
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: postgres
  releaseName: postgres
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-cluster
  namespace: postgres
spec:
  interval: 15m0s
  timeout: 5m0s
  chart:
    spec:
      chart: cluster
      version: 0.9.0
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: postgres
  releaseName: postgres-cluster
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  values:
    cluster:
      storage:
        storageClass: "rbd-ssd"

      resources:
        limits:
          cpu: 2000m
          memory: 8Gi
        requests:
          cpu: 2000m
          memory: 8Gi
      
      affinity:

      enableSuperuserAccess: false   
