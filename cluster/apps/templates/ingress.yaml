apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: templates
  namespace: templates
spec:
  rules:
  - host: templates.ocf.berkeley.edu
    http:
      paths:
      - backend:
          service:
            name: templates
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - templates.ocf.berkeley.edu
    secretName: templates-tls
