apiVersion: v1
kind: Namespace
metadata:
  name: postgres
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: postgres
  namespace: postgres
spec:
  interval: 15m0s
  url: https://cloudnative-pg.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
  namespace: postgres
spec:
  interval: 15m0s
  timeout: 5m0s
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.1
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: postgres
  releaseName: postgres
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
