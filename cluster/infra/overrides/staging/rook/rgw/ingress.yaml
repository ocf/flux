apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: o3
  namespace: rook
spec:
  rules:
  - host: o3.staging.ocf.io
    http:
      paths:
      - backend:
          service:
            name: rook-rgw-ssd
            port:
              number: 80
        path: /
        pathType: Prefix
  - host: o3.staging.ocf.berkeley.edu
    http:
      paths:
      - backend:
          service:
            name: rook-rgw-ssd
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - o3.staging.ocf.io
    - o3.staging.ocf.berkeley.edu
    secretName: o3-staging-ocf-crt
