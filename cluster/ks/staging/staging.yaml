apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: staging
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/ks/staging-apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster-staging
  ignore: |
    # exclude all
    /*

    !staging-apps.yaml
