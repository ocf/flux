apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: keycloak
  namespace: keycloak
spec:
  type: "oci"
  interval: 15m
  url: oci://ghcr.io/codecentric/helm-charts/keycloak 
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: keycloak
spec:
  interval: 1m
  timeout: 5m
  chart:
    spec:
      chart: keycloak
      version: '18.10.0'
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: keycloak
  valuesFrom:
    - kind: ConfigMap
      name: keycloak-values