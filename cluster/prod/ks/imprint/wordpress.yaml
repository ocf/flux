apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wordpress
  namespace: imprint
spec:
  interval: 10m0s
  path: ./manifests/wordpress
  prune: true
  sourceRef:
    kind: GitRepository
    name: imprint
  decryption:
    provider: sops
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: wordpress-sites
  namespace: imprint
spec:
  interval: 10m0s
  path: ./wordpress/ks
  prune: true
  sourceRef:
    kind: GitRepository
    name: imprint-sites
  decryption:
    provider: sops
  patches:
    - target: # patch site kustomization to patch ingress
        kind: Kustomization
      patch: |
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: ignored
        spec:
          decryption:
            provider: sops
          patches:
            - target:
                kind: Ingress
              patch: |
                apiVersion: networking.k8s.io/v1
                kind: Ingress
                metadata:
                  name: ignored
                  annotations:
                    cert-manager.io/cluster-issuer: letsencrypt
                    ingress.kubernetes.io/force-ssl-redirect: 'true'
                    io.cilium/websocket: enabled
                    kubernetes.io/tls-acme: 'true'
                    projectcontour.io/websocket-routes: /
