apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: helm-common
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./cluster/common/helm
  prune: true
  sourceRef:
    kind: GitRepository
    name: cluster
  patches:
    - patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: cilium
          namespace: cilium
        spec:
          values:
            k8sServiceHost: gravitywell.ocf.io
