apiVersion: v1
kind: Namespace
metadata:
  name: mariadb
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: mariadb
  namespace: mariadb
spec:
  interval: 15m0s
  type: oci
  url: oci://ghcr.io/mariadb-operator/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator-crds
  namespace: mariadb
spec:
  chart:
    spec:
      chart: mariadb-operator-crds
      interval: 5m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: mariadb
      version: 26.6.0
  install:
    remediation:
      retries: 3
  interval: 15m0s
  releaseName: mariadb-operator-crds
  test:
    enable: true
  timeout: 5m0s
  upgrade:
    remediation:
      retries: 3
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator
  namespace: mariadb
spec:
  chart:
    spec:
      chart: mariadb-operator
      interval: 5m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: mariadb
      version: 26.6.0
  install:
    remediation:
      retries: 3
  interval: 15m0s
  releaseName: mariadb-operator
  test:
    enable: true
  timeout: 5m0s
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: mariadb-operator-values
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-cluster
  namespace: mariadb
spec:
  chart:
    spec:
      chart: mariadb-cluster
      interval: 5m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: mariadb
      version: 26.6.0
  install:
    remediation:
      retries: 3
  interval: 15m0s
  releaseName: mariadb-cluster
  test:
    enable: true
  timeout: 5m0s
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: mariadb-cluster-values
